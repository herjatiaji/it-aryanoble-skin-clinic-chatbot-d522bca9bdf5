services:
  db:
    image: pgvector/pgvector:pg16
    container_name: skin_clinic_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arya_noble
    ports:
      - "50010:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arya_noble"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: skin_clinic_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    container_name: skin_clinic_backend
    restart: always
    cpus: 1.5
    mem_limit: 3000m
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/arya_noble
      - PG_HOST=db
      - PG_PORT=5432
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10m
    volumes:
      - ./backend:/app
      - ./.hf_cache:/root/.cache/huggingface

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: skin_clinic_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      - CI=true
      - NODE_OPTIONS=--max-old-space-size=1024
      - WATCHPACK_POLLING=true
    cpus: 2
    mem_limit: 1536m
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  mock-cis:
    build:
      context: ./mock-cis
    container_name: skin_clinic_mock_cis
    restart: always
    ports:
      - "8001:8001"
    environment:
      - BACKEND_URL=http://backend:8000
      - BACKEND_WEBHOOK_URL=http://backend:8000/api/webhooks/cis
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  minio_data:
